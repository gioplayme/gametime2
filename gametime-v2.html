<!DOCTYPE html>
<html lang="en" data-theme="dark">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>GameTime</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Chakra+Petch:wght@500;600;700&family=Barlow:wght@400;500;600&family=Noto+Sans+Georgian:wght@400;500;600;700&display=swap" rel="stylesheet">
<style>
:root{
  --bg:#06060a; --bg-2:#0a0a0f; --panel:rgba(20,20,27,.72); --panel-solid:#14141b;
  --glass:rgba(255,255,255,.035); --line:rgba(255,255,255,.08); --line-2:rgba(255,255,255,.16);
  --red:#ff2740; --red-2:#ff5c6e; --red-soft:rgba(255,39,64,.13);
  --text:#f4f4f7; --muted:#9c9cab; --muted-2:#6c6c7b; --gold:#ffc65c;
  --r:16px; --shadow:0 18px 40px -24px #000;
  --glow:0 0 0 1px rgba(255,39,64,.45), 0 22px 60px -26px rgba(255,39,64,.65);
  --ease:cubic-bezier(.2,.8,.24,1);
  --font-ui:"Chakra Petch","Noto Sans Georgian",system-ui,sans-serif;
  --font-body:"Barlow","Noto Sans Georgian",system-ui,sans-serif;
}
:root:not([data-theme="light"]){color-scheme:dark;}
html[lang="ka"]{--font-ui:"Noto Sans Georgian",system-ui,sans-serif;--font-body:"Noto Sans Georgian",system-ui,sans-serif;}
html[lang="ka"] body{letter-spacing:0;}
html[lang="ka"] h1,html[lang="ka"] h2,html[lang="ka"] h3,html[lang="ka"] .btn,html[lang="ka"] .chip{letter-spacing:0;}
*{box-sizing:border-box;}
html,body{margin:0;padding:0;}
body{background:var(--bg);color:var(--text);font-family:var(--font-body);font-size:16px;line-height:1.6;
  -webkit-font-smoothing:antialiased;overflow-x:hidden;padding-bottom:0;}
h1,h2,h3,h4{margin:0;line-height:1.15;font-family:var(--font-ui);font-weight:700;}
a{color:inherit;text-decoration:none;}
button{font:inherit;color:inherit;background:none;border:none;cursor:pointer;font-family:var(--font-ui);}
input,select,textarea{font-family:var(--font-body);}
img{max-width:100%;display:block;}
:focus-visible{outline:2px solid var(--red);outline-offset:2px;border-radius:8px;}
::selection{background:var(--red);color:#fff;}
.wrap{width:min(1280px,100% - 40px);margin-inline:auto;}
@media(max-width:640px){.wrap{width:min(1280px,100% - 26px);}}
.glass{background:var(--panel);backdrop-filter:blur(16px);border:1px solid var(--line);border-radius:var(--r);box-shadow:var(--shadow);}

/* header */
.topbar{position:sticky;top:0;z-index:70;background:rgba(6,6,10,.8);backdrop-filter:blur(18px);border-bottom:1px solid var(--line);}
.topbar-in{display:flex;align-items:center;gap:18px;height:68px;}
.logo{display:flex;align-items:center;gap:9px;flex:0 0 auto;}
.logo-mark{width:34px;height:34px;display:grid;place-items:center;border-radius:11px;flex:0 0 auto;
  background:linear-gradient(150deg,#22222d,#0c0c11);border:1px solid rgba(255,39,64,.55);
  box-shadow:inset 0 0 20px -6px rgba(255,39,64,.8),0 0 18px -8px rgba(255,39,64,.9);}
.logo-mark svg{width:19px;height:19px;fill:var(--red);}
.logo-txt{font-family:"Chakra Petch",sans-serif;font-weight:700;font-size:1.3rem;letter-spacing:.11em;}
.logo-txt span{color:var(--red);text-shadow:0 0 18px rgba(255,39,64,.8);}
.nav{display:flex;gap:2px;margin-left:8px;}
.nav button{padding:9px 13px;border-radius:10px;font-weight:600;font-size:.93rem;color:var(--muted);transition:.18s;}
.nav button:hover{color:var(--text);background:var(--glass);}
.nav button[aria-current="page"]{color:var(--text);background:var(--red-soft);box-shadow:inset 0 0 0 1px rgba(255,39,64,.38);}
.spacer{margin-left:auto;}
.searchbox{position:relative;flex:1 1 240px;max-width:300px;}
.searchbox input{width:100%;background:#0e0e14;border:1px solid var(--line);color:var(--text);border-radius:12px;
  padding:10px 12px 10px 36px;font-size:.92rem;transition:.2s;}
.searchbox input::placeholder{color:var(--muted-2);}
.searchbox input:focus{outline:none;border-color:rgba(255,39,64,.65);box-shadow:0 0 0 3px rgba(255,39,64,.12);}
.searchbox svg{position:absolute;left:12px;top:50%;transform:translateY(-50%);width:15px;height:15px;fill:var(--muted-2);}
.lang{display:flex;align-items:center;border:1px solid var(--line);border-radius:10px;overflow:hidden;flex:0 0 auto;}
.lang button{padding:7px 11px;font-size:.84rem;font-weight:600;color:var(--muted-2);transition:.18s;}
.lang button[aria-pressed="true"]{background:var(--red-soft);color:var(--red-2);box-shadow:inset 0 0 0 1px rgba(255,39,64,.35);}
.lang button:hover{color:var(--text);}
.bell{position:relative;width:38px;height:38px;border-radius:11px;border:1px solid var(--line);display:grid;place-items:center;}
.bell svg{width:17px;height:17px;fill:var(--muted);}
.bell:hover{border-color:rgba(255,39,64,.5);}
.bell b{position:absolute;top:-5px;right:-5px;min-width:18px;height:18px;border-radius:9px;background:var(--red);
  color:#fff;font-size:.68rem;display:grid;place-items:center;padding:0 5px;font-family:var(--font-ui);}
.avatar{border-radius:11px;display:grid;place-items:center;font-family:"Chakra Petch",sans-serif;font-weight:700;
  color:#08080b;flex:0 0 auto;width:34px;height:34px;font-size:.85rem;}
.avatar.sm{width:28px;height:28px;border-radius:9px;font-size:.72rem;}
.avatar.lg{width:72px;height:72px;border-radius:20px;font-size:1.7rem;}
.userchip{display:flex;align-items:center;gap:8px;padding:4px 11px 4px 4px;border-radius:12px;border:1px solid var(--line);background:#0e0e14;}
.userchip:hover{border-color:rgba(255,39,64,.5);}
.userchip b{font-family:var(--font-ui);font-weight:600;font-size:.89rem;}
.burger{display:none;width:38px;height:38px;border-radius:11px;border:1px solid var(--line);place-items:center;}
.burger svg{width:19px;height:19px;fill:var(--text);}

/* buttons */
.btn{display:inline-flex;align-items:center;justify-content:center;gap:8px;padding:11px 18px;border-radius:12px;
  font-weight:600;font-size:.93rem;border:1px solid var(--line-2);background:#16161e;color:var(--text);
  transition:transform .12s var(--ease),background .2s,border-color .2s,box-shadow .25s;}
.btn:hover{background:#1e1e28;}
.btn:active{transform:translateY(1px) scale(.985);}
.btn svg{width:15px;height:15px;fill:currentColor;}
.btn-red{background:linear-gradient(180deg,#ff3149,#d0122b);border-color:#ff4a5f;color:#fff;box-shadow:0 12px 30px -16px rgba(255,39,64,.95);}
.btn-red:hover{background:linear-gradient(180deg,#ff475c,#e21532);box-shadow:0 16px 36px -14px rgba(255,39,64,1);}
.btn-ghost{background:transparent;border-color:var(--line);color:var(--muted);}
.btn-ghost:hover{color:var(--text);border-color:rgba(255,39,64,.45);background:var(--red-soft);}
.btn-lg{padding:15px 28px;font-size:1rem;border-radius:14px;}
.btn-sm{padding:7px 12px;font-size:.84rem;border-radius:10px;}
.btn-danger{color:#ff97a3;border-color:rgba(255,39,64,.32);}
.btn-danger:hover{background:rgba(255,39,64,.16);color:#fff;border-color:var(--red);}
.btn-ok{color:#8ff0bb;border-color:rgba(61,220,132,.3);}
.btn-ok:hover{background:rgba(61,220,132,.14);color:#fff;border-color:#3ddc84;}

/* hero */
.hero{position:relative;overflow:hidden;border-bottom:1px solid var(--line);}
.hero-bg{position:absolute;inset:0;pointer-events:none;}
.hero-bg .aur{position:absolute;border-radius:50%;filter:blur(30px);}
.hero-bg .a1{width:760px;height:760px;left:-200px;top:-360px;background:radial-gradient(circle,rgba(255,39,64,.34),transparent 62%);animation:drift 18s ease-in-out infinite alternate;}
.hero-bg .a2{width:620px;height:620px;right:-180px;bottom:-320px;background:radial-gradient(circle,rgba(255,39,64,.2),transparent 65%);animation:drift 22s ease-in-out infinite alternate-reverse;}
@keyframes drift{from{transform:translate3d(0,0,0)}to{transform:translate3d(60px,40px,0)}}
.hero-bg .grid{position:absolute;inset:0;opacity:.45;
  background-image:linear-gradient(rgba(255,255,255,.05) 1px,transparent 1px),linear-gradient(90deg,rgba(255,255,255,.05) 1px,transparent 1px);
  background-size:64px 64px;
  mask-image:radial-gradient(ellipse 78% 68% at 50% 22%,#000 28%,transparent 76%);
  -webkit-mask-image:radial-gradient(ellipse 78% 68% at 50% 22%,#000 28%,transparent 76%);}
.hero-bg .beam{position:absolute;left:0;right:0;top:0;height:2px;background:linear-gradient(90deg,transparent,var(--red),transparent);animation:beam 8s var(--ease) infinite;}
@keyframes beam{0%{transform:translateY(0);opacity:0}10%{opacity:.6}72%{transform:translateY(440px);opacity:0}100%{transform:translateY(440px);opacity:0}}
.hero-in{position:relative;padding:92px 0 80px;display:grid;gap:26px;max-width:800px;}
.hero h1{font-size:clamp(2.4rem,7vw,5rem);letter-spacing:-.01em;text-shadow:0 0 50px rgba(255,39,64,.3);}
.hero h1 i{color:var(--red);font-style:normal;}
.hero p{margin:0;font-size:clamp(1.02rem,2.1vw,1.24rem);color:var(--muted);max-width:52ch;}
.hero-actions{display:flex;gap:12px;flex-wrap:wrap;}
.stats{display:flex;gap:34px;flex-wrap:wrap;padding-top:14px;border-top:1px solid var(--line);}
.stats b{display:block;font-family:var(--font-ui);font-size:1.7rem;line-height:1.2;}
.stats small{color:var(--muted-2);font-size:.82rem;}

/* sections */
.section{padding:52px 0;}
.section-head{display:flex;align-items:flex-end;justify-content:space-between;gap:16px;margin-bottom:22px;flex-wrap:wrap;}
.section-head h2{font-size:1.5rem;display:flex;align-items:center;gap:11px;}
.section-head h2 i{width:8px;height:22px;border-radius:3px;background:var(--red);box-shadow:0 0 18px rgba(255,39,64,.9);flex:0 0 auto;}
.section-head p{margin:5px 0 0;color:var(--muted);font-size:.93rem;}
.grid-games{display:grid;grid-template-columns:repeat(auto-fill,minmax(285px,1fr));gap:20px;}

/* card */
.card{position:relative;display:flex;flex-direction:column;border-radius:var(--r);overflow:hidden;
  background:linear-gradient(180deg,rgba(24,24,32,.9),rgba(12,12,17,.95));border:1px solid var(--line);
  box-shadow:var(--shadow);transition:transform .26s var(--ease),border-color .26s,box-shadow .3s;}
.card:hover{transform:translateY(-5px);border-color:rgba(255,39,64,.5);box-shadow:var(--glow);}
.card:hover .cover img{transform:scale(1.06);}
.card.featured{border-color:rgba(255,39,64,.5);box-shadow:0 0 0 1px rgba(255,39,64,.3),0 22px 54px -28px rgba(255,39,64,.8);}
.cover{position:relative;aspect-ratio:16/9;overflow:hidden;background:#09090d;cursor:pointer;}
.cover img{width:100%;height:100%;object-fit:cover;transition:transform .55s var(--ease);position:absolute;inset:0;}
.cover .fb{position:absolute;inset:0;display:grid;place-items:center;}
.cover .fb span{font-family:"Chakra Petch",sans-serif;font-weight:700;font-size:2.3rem;letter-spacing:.12em;color:rgba(255,255,255,.92);text-shadow:0 2px 24px rgba(0,0,0,.7);}
.cover::after{content:"";position:absolute;inset:0;background:linear-gradient(180deg,transparent 42%,rgba(6,6,10,.9));pointer-events:none;}
.pill{position:absolute;z-index:2;padding:4px 10px;border-radius:8px;font-family:var(--font-ui);font-weight:600;
  font-size:.72rem;background:rgba(6,6,10,.8);backdrop-filter:blur(6px);border:1px solid var(--line-2);color:var(--muted);}
.pill.cat{left:11px;top:11px;border-color:rgba(255,39,64,.45);color:#ff97a3;}
.pill.feat{right:11px;top:11px;border-color:rgba(255,198,92,.5);color:var(--gold);}
.pill.pend{right:11px;top:11px;border-color:rgba(255,198,92,.5);color:var(--gold);}
.card-body{padding:15px 16px 16px;display:flex;flex-direction:column;gap:9px;flex:1;}
.card-body h3{font-size:1.1rem;font-weight:600;cursor:pointer;transition:color .2s;}
.card-body h3:hover{color:var(--red);}
.meta-row{display:flex;gap:8px;flex-wrap:wrap;color:var(--muted-2);font-size:.79rem;font-family:var(--font-ui);}
.meta-row span{padding:2px 8px;border-radius:7px;background:var(--glass);border:1px solid var(--line);}
.desc{margin:0;color:var(--muted);font-size:.9rem;display:-webkit-box;-webkit-line-clamp:2;line-clamp:2;-webkit-box-orient:vertical;overflow:hidden;}
.byline{display:flex;align-items:center;gap:8px;color:var(--muted-2);font-size:.82rem;}
.byline b{color:var(--muted);font-weight:500;cursor:pointer;}
.byline b:hover{color:var(--red);}
.card-foot{display:flex;align-items:center;gap:4px;margin-top:auto;padding-top:12px;border-top:1px solid var(--line);}
.act{display:inline-flex;align-items:center;gap:6px;padding:6px 9px;border-radius:10px;color:var(--muted);
  font-size:.85rem;font-family:var(--font-ui);font-weight:600;transition:.18s;}
.act:hover{color:var(--text);background:var(--glass);}
.act svg{width:16px;height:16px;fill:currentColor;transition:transform .25s var(--ease);}
.act.on{color:var(--red);}
.act.on svg{filter:drop-shadow(0 0 8px rgba(255,39,64,.9));}
.act.pop svg{animation:pop .42s var(--ease);}
@keyframes pop{0%{transform:scale(1)}35%{transform:scale(1.5)}60%{transform:scale(.9)}100%{transform:scale(1)}}
.push{margin-left:auto;}

/* chips / tabs */
.chips{display:flex;gap:8px;flex-wrap:wrap;margin-bottom:22px;}
.chip{padding:7px 14px;border-radius:99px;border:1px solid var(--line);background:#0f0f15;color:var(--muted);
  font-family:var(--font-ui);font-weight:600;font-size:.85rem;transition:.2s;}
.chip:hover{color:var(--text);border-color:var(--line-2);}
.chip[aria-pressed="true"]{background:var(--red);border-color:var(--red);color:#fff;box-shadow:0 0 24px -8px rgba(255,39,64,.95);}
.tabs{display:flex;gap:4px;border-bottom:1px solid var(--line);margin-bottom:22px;overflow-x:auto;}
.tabs button{padding:11px 15px;font-weight:600;font-size:.93rem;color:var(--muted);border-bottom:2px solid transparent;white-space:nowrap;transition:.2s;}
.tabs button:hover{color:var(--text);}
.tabs button[aria-selected="true"]{color:var(--text);border-bottom-color:var(--red);}

/* forms */
.form{display:grid;gap:16px;}
.field{display:grid;gap:7px;}
.field label{font-family:var(--font-ui);font-weight:600;font-size:.88rem;}
.field small{color:var(--muted-2);font-size:.8rem;}
.field input,.field select,.field textarea{background:#0c0c12;border:1px solid var(--line);color:var(--text);
  border-radius:12px;padding:12px 14px;width:100%;font-size:.95rem;transition:.2s;}
.field textarea{min-height:110px;resize:vertical;}
.field select{font-family:var(--font-ui);}
.field input:focus,.field select:focus,.field textarea:focus{outline:none;border-color:rgba(255,39,64,.68);box-shadow:0 0 0 3px rgba(255,39,64,.12);}
.row2{display:grid;grid-template-columns:1fr 1fr;gap:16px;}
.row3{display:grid;grid-template-columns:1fr 1fr 1fr;gap:16px;}
@media(max-width:700px){.row2,.row3{grid-template-columns:1fr;}}
.err{color:#ff97a3;font-size:.88rem;min-height:1.2em;margin:0;}

/* detail page */
.banner{position:relative;aspect-ratio:21/8;border-radius:20px;overflow:hidden;background:#09090d;border:1px solid var(--line);}
.banner img{width:100%;height:100%;object-fit:cover;position:absolute;inset:0;}
.banner .fb{position:absolute;inset:0;display:grid;place-items:center;}
.banner .fb span{font-family:"Chakra Petch",sans-serif;font-weight:700;font-size:clamp(2rem,7vw,4.5rem);letter-spacing:.14em;color:rgba(255,255,255,.93);}
.banner::after{content:"";position:absolute;inset:0;background:linear-gradient(180deg,transparent 35%,rgba(6,6,10,.95));}
.detail-split{display:grid;grid-template-columns:1fr 330px;gap:24px;align-items:start;margin-top:26px;}
@media(max-width:940px){.detail-split{grid-template-columns:1fr;}}
.shots{display:grid;grid-template-columns:repeat(auto-fill,minmax(180px,1fr));gap:12px;}
.shots div{aspect-ratio:16/9;border-radius:12px;overflow:hidden;border:1px solid var(--line);background:#09090d;position:relative;}
.shots img{width:100%;height:100%;object-fit:cover;}
.kv{display:flex;justify-content:space-between;gap:12px;padding:10px 0;border-bottom:1px solid var(--line);font-size:.92rem;}
.kv:last-child{border-bottom:none;}
.kv span:first-child{color:var(--muted-2);font-family:var(--font-ui);}

/* comments */
.comment{display:flex;gap:11px;padding:14px 0;border-bottom:1px solid var(--line);}
.comment:last-child{border-bottom:none;}
.comment-main{flex:1;min-width:0;}
.comment-head{display:flex;align-items:center;gap:9px;flex-wrap:wrap;}
.comment-head b{font-family:var(--font-ui);font-size:.92rem;cursor:pointer;}
.comment-head b:hover{color:var(--red);}
.comment-head time{color:var(--muted-2);font-size:.79rem;}
.comment p{margin:4px 0 6px;color:#d8d8e0;font-size:.94rem;overflow-wrap:anywhere;}

/* community */
.feed{display:grid;gap:16px;}
.post{padding:18px;border-radius:var(--r);background:linear-gradient(180deg,rgba(22,22,30,.85),rgba(12,12,17,.9));
  border:1px solid var(--line);transition:border-color .25s,transform .2s var(--ease);}
.post:hover{border-color:rgba(255,39,64,.35);}
.post-head{display:flex;align-items:center;gap:10px;margin-bottom:10px;flex-wrap:wrap;}
.ptype{padding:3px 10px;border-radius:8px;font-family:var(--font-ui);font-weight:600;font-size:.74rem;
  background:var(--red-soft);color:#ff97a3;border:1px solid rgba(255,39,64,.32);}
.post h3{font-size:1.14rem;margin-bottom:6px;}
.post .body{color:#d0d0da;font-size:.95rem;margin:0;white-space:pre-wrap;overflow-wrap:anywhere;}
.post-foot{display:flex;gap:4px;align-items:center;margin-top:14px;padding-top:12px;border-top:1px solid var(--line);flex-wrap:wrap;}

/* misc */
.empty{border:1px dashed var(--line-2);border-radius:var(--r);padding:48px 24px;text-align:center;color:var(--muted);background:rgba(13,13,18,.6);}
.empty h3{font-size:1.16rem;margin-bottom:8px;color:var(--text);}
.empty p{margin:0 0 18px;font-size:.93rem;max-width:46ch;margin-inline:auto;}
.note{display:flex;gap:11px;align-items:flex-start;padding:13px 15px;border-radius:12px;
  background:rgba(255,39,64,.07);border:1px solid rgba(255,39,64,.26);color:#ffb8c2;font-size:.88rem;}
.note svg{width:17px;height:17px;fill:var(--red);flex:0 0 auto;margin-top:3px;}
.note.info{background:rgba(255,255,255,.04);border-color:var(--line);color:var(--muted);}
.note.info svg{fill:var(--muted);}
.kpis{display:grid;grid-template-columns:repeat(auto-fit,minmax(150px,1fr));gap:14px;margin-bottom:24px;}
.kpi{padding:18px;border-radius:14px;background:linear-gradient(160deg,rgba(255,39,64,.1),rgba(18,18,25,.9));border:1px solid var(--line);}
.kpi b{display:block;font-family:var(--font-ui);font-size:2rem;line-height:1.1;}
.kpi small{color:var(--muted-2);font-size:.82rem;}
.tbl{width:100%;border-collapse:collapse;font-size:.92rem;}
.tbl th{text-align:left;color:var(--muted-2);font-family:var(--font-ui);font-weight:600;font-size:.8rem;padding:9px 10px;border-bottom:1px solid var(--line);white-space:nowrap;}
.tbl td{padding:11px 10px;border-bottom:1px solid var(--line);vertical-align:middle;}
.tbl tr:last-child td{border-bottom:none;}
.scrollx{overflow-x:auto;}
.badge{display:inline-block;padding:2px 9px;border-radius:7px;font-size:.75rem;font-family:var(--font-ui);font-weight:600;}
.badge.a{background:rgba(255,39,64,.18);color:#ff97a3;border:1px solid rgba(255,39,64,.4);}
.badge.n{background:var(--glass);color:var(--muted);border:1px solid var(--line);}
.badge.p{background:rgba(255,198,92,.14);color:var(--gold);border:1px solid rgba(255,198,92,.35);}
.badge.r{background:rgba(255,39,64,.1);color:#ff97a3;border:1px solid rgba(255,39,64,.3);}
.badge.o{background:rgba(61,220,132,.12);color:#8ff0bb;border:1px solid rgba(61,220,132,.3);}
.linkrow{display:flex;align-items:center;gap:11px;padding:11px 13px;border-radius:12px;border:1px solid var(--line);
  background:#0e0e14;transition:.2s;}
.linkrow:hover{border-color:rgba(255,39,64,.5);background:#14141c;transform:translateX(3px);}
.linkrow b{font-family:var(--font-ui);font-weight:600;font-size:.93rem;}
.linkrow small{display:block;color:var(--muted-2);font-size:.8rem;}
.linkrow svg{width:15px;height:15px;fill:var(--muted-2);margin-left:auto;flex:0 0 auto;}
.catgrid{display:grid;grid-template-columns:repeat(auto-fill,minmax(180px,1fr));gap:14px;}
.catcard{padding:20px;border-radius:14px;border:1px solid var(--line);background:linear-gradient(160deg,rgba(24,24,32,.9),rgba(11,11,16,.95));
  text-align:left;transition:.24s var(--ease);}
.catcard:hover{border-color:rgba(255,39,64,.5);transform:translateY(-3px);box-shadow:var(--glow);}
.catcard b{display:block;font-family:var(--font-ui);font-size:1.06rem;margin-bottom:3px;}
.catcard small{color:var(--muted-2);}
.rank-item{display:flex;align-items:center;gap:12px;padding:11px 0;border-bottom:1px solid var(--line);cursor:pointer;text-align:left;width:100%;}
.rank-item:last-child{border-bottom:none;}
.rank-item:hover .rn{color:var(--red);}
.rank-thumb{width:58px;height:38px;border-radius:8px;overflow:hidden;flex:0 0 auto;position:relative;background:#09090d;}
.rank-thumb img{width:100%;height:100%;object-fit:cover;position:absolute;inset:0;}
.rn{font-family:var(--font-ui);font-weight:600;font-size:.94rem;transition:.2s;display:block;white-space:nowrap;overflow:hidden;text-overflow:ellipsis;}
.rmeta{color:var(--muted-2);font-size:.79rem;}
.toast{position:fixed;left:50%;bottom:86px;transform:translateX(-50%);z-index:200;background:#17171f;
  border:1px solid rgba(255,39,64,.5);padding:12px 20px;border-radius:13px;box-shadow:var(--glow);
  font-family:var(--font-ui);font-weight:600;font-size:.92rem;animation:tin .3s var(--ease);max-width:calc(100% - 32px);text-align:center;}
@keyframes tin{from{opacity:0;transform:translate(-50%,14px)}to{opacity:1;transform:translate(-50%,0)}}
.loader{display:grid;place-items:center;padding:80px 0;gap:14px;color:var(--muted);}
.spinner{width:34px;height:34px;border-radius:50%;border:3px solid var(--line-2);border-top-color:var(--red);animation:spin .8s linear infinite;}
@keyframes spin{to{transform:rotate(360deg)}}

/* modal */
.overlay{position:fixed;inset:0;z-index:120;background:rgba(4,4,7,.8);backdrop-filter:blur(8px);
  display:grid;place-items:start center;padding:6vh 16px 40px;overflow-y:auto;animation:fade .2s var(--ease);}
@keyframes fade{from{opacity:0}to{opacity:1}}
.modal{width:min(460px,100%);background:var(--panel-solid);border:1px solid var(--line-2);border-radius:18px;
  box-shadow:0 40px 90px -30px #000,var(--glow);overflow:hidden;animation:rise .28s var(--ease);}
.modal.wide{width:min(720px,100%);}
@keyframes rise{from{opacity:0;transform:translateY(14px) scale(.985)}to{opacity:1;transform:none}}
.modal-head{display:flex;align-items:center;justify-content:space-between;gap:12px;padding:17px 20px;border-bottom:1px solid var(--line);}
.modal-head h3{font-size:1.18rem;}
.modal-body{padding:20px;}
.x{width:34px;height:34px;border-radius:10px;display:grid;place-items:center;color:var(--muted);border:1px solid var(--line);}
.x:hover{color:#fff;background:rgba(255,39,64,.18);border-color:rgba(255,39,64,.5);}
.x svg{width:15px;height:15px;fill:currentColor;}

/* mobile bottom nav */
.bottom{display:none;position:fixed;left:0;right:0;bottom:0;z-index:80;background:rgba(9,9,14,.94);
  backdrop-filter:blur(18px);border-top:1px solid var(--line);padding:6px 4px calc(6px + env(safe-area-inset-bottom));}
.bottom-in{display:flex;}
.bottom button{flex:1;display:grid;justify-items:center;gap:3px;padding:7px 2px;border-radius:12px;color:var(--muted-2);font-size:.7rem;font-weight:600;}
.bottom button svg{width:20px;height:20px;fill:currentColor;}
.bottom button[aria-current="page"]{color:var(--red);}
.bottom button[aria-current="page"] svg{filter:drop-shadow(0 0 8px rgba(255,39,64,.8));}
.modal.sm{width:min(380px,100%);}
.modal.sm .modal-body{padding:22px 22px 20px;}
.notif{display:flex;gap:12px;align-items:flex-start;padding:12px 6px;border-bottom:1px solid var(--line);position:relative;}
.notif:last-child{border-bottom:none;}
.notif.unread{background:rgba(255,39,64,.05);border-radius:10px;}
.notif.unread::before{content:"";position:absolute;left:0;top:14px;bottom:14px;width:3px;border-radius:2px;background:var(--red);}
.n-ico{width:34px;height:34px;border-radius:10px;display:grid;place-items:center;flex:0 0 auto;border:1px solid var(--line);}
.n-ico svg{width:16px;height:16px;fill:currentColor;}
.n-ico.new{color:var(--red-2);background:rgba(255,39,64,.12);}
.n-ico.ok{color:#8ff0bb;background:rgba(61,220,132,.12);}
.n-ico.bad{color:#ff97a3;background:rgba(255,39,64,.1);}
.n-ico.info{color:#9ec8ff;background:rgba(90,150,255,.12);}
.n-ico.like{color:var(--red-2);background:rgba(255,39,64,.12);}
.notif-body{flex:1;min-width:0;text-align:left;background:none;border:none;padding:0;cursor:pointer;}
.notif-body b{display:block;font-family:var(--font-ui);font-size:.92rem;font-weight:600;color:var(--text);}
.notif-body p{margin:2px 0 3px;color:var(--muted);font-size:.86rem;overflow-wrap:anywhere;}
.notif-body time{color:var(--muted-2);font-size:.78rem;}
.n-del{width:28px;height:28px;border-radius:8px;display:grid;place-items:center;color:var(--muted-2);flex:0 0 auto;}
.n-del svg{width:12px;height:12px;fill:currentColor;}
.n-del:hover{color:#fff;background:rgba(255,39,64,.2);}
.cover-drop{position:relative;border:1px dashed var(--line-2);border-radius:14px;overflow:hidden;background:#0b0b11;min-height:150px;display:flex;}
.cover-drop.has-img{border-style:solid;border-color:var(--line);}
.cover-pick{flex:1;display:grid;place-items:center;gap:6px;padding:28px 16px;color:var(--muted);transition:.2s;}
.cover-pick:hover{color:var(--text);background:rgba(255,39,64,.05);}
.cover-pick svg{opacity:.7;}
.cover-pick b{font-family:var(--font-ui);font-size:.95rem;font-weight:600;}
.cover-pick small{color:var(--muted-2);font-size:.78rem;}
.cover-preview{width:100%;aspect-ratio:16/9;object-fit:cover;display:block;}
.cover-overlay{position:absolute;inset:0;background:rgba(6,6,10,.6);display:grid;place-items:center;gap:8px;color:#fff;font-family:var(--font-ui);font-weight:600;font-size:.85rem;}
.spinner.sm{width:22px;height:22px;border-width:2px;}
.cover-actions{position:absolute;right:10px;bottom:10px;display:flex;gap:8px;}
.btn[disabled]{opacity:.55;cursor:not-allowed;pointer-events:none;}
footer{border-top:1px solid var(--line);padding:28px 0;color:var(--muted-2);font-size:.86rem;margin-top:36px;}
footer .wrap{display:flex;justify-content:space-between;gap:12px;flex-wrap:wrap;}

@media(max-width:900px){
  .nav,.searchbox,.spacer{display:none;}
  .topbar-in{gap:10px;}
  .topbar-in .lang{margin-left:auto;}
  .userchip b{display:none;}
  .burger{display:grid;}
  .bottom{display:block;}
  body{padding-bottom:74px;}
  .toast{bottom:92px;}
  .drawer-open .nav{display:flex;position:absolute;left:0;right:0;top:68px;flex-direction:column;align-items:stretch;
    background:#0a0a10;border-bottom:1px solid var(--line);padding:10px;gap:2px;margin:0;}
  .drawer-open .nav button{text-align:left;padding:13px 14px;font-size:1rem;}
  .drawer-open .searchbox{display:block;position:absolute;left:10px;right:10px;top:68px;transform:translateY(310px);max-width:none;}
  .hero-in{padding:58px 0 52px;}
}
@media(prefers-reduced-motion:reduce){*{animation-duration:.01ms !important;animation-iteration-count:1 !important;transition-duration:.01ms !important;}}
</style>

/* ========================= storage =========================
   Every write updates the in-memory DATA map immediately (optimistic),
   re-renders right away so the UI never waits on a network round trip,
   then persists to the real backend. If the backend call fails, the
   local change is rolled back, the UI re-renders again, and the error
   is surfaced with a toast rather than swallowed. */
const LSKEY = "gametime_v2_local";
const lsAll = ()=>{ try{ return JSON.parse(localStorage.getItem(LSKEY)||"{}"); }catch(e){ return {}; } };
const lsSave = o => { try{ localStorage.setItem(LSKEY, JSON.stringify(o)); }catch(e){} };
function lsLoad(){ const o=lsAll(); Object.keys(DATA).forEach(c=>{ DATA[c].clear();
  Object.entries(o[c]||{}).forEach(([k,v])=>DATA[c].set(k,v)); }); }
async function put(coll,id,data){
  const prev = DATA[coll].get(id), hadPrev = DATA[coll].has(id);
  DATA[coll].set(id,data); render();
  if(db){
    try{ await db.doc(coll+"/"+id).set(data); }
    catch(err){
      if(hadPrev) DATA[coll].set(id,prev); else DATA[coll].delete(id);
      render(); toast(t("actionFailed")); throw err;
    }
    return;
  }
  const o=lsAll(); o[coll]=o[coll]||{}; o[coll][id]=data; lsSave(o);
}
async function remove(coll,id){
  const prev = DATA[coll].get(id), hadPrev = DATA[coll].has(id);
  DATA[coll].delete(id); render();
  if(db){
    try{ await db.doc(coll+"/"+id).delete(); }
    catch(err){
      if(hadPrev) DATA[coll].set(id,prev);
      render(); toast(t("deleteFailed")); throw err;
    }
    return;
  }
  const o=lsAll(); if(o[coll]) delete o[coll][id]; lsSave(o);
}

   collection whose writes require "can edit" access to this artifact

function hue(s){ let h=0; for(let i=0;i<s.length;i++) h=(h*31+s.charCodeAt(i))%360; return h; }

}

function ago(ts){
  const s=Math.max(1,(Date.now()-ts)/1000);
  if(s<60) return LANG==="ka"?"ახლახან":"just now";
  const m=s/60; if(m<60) return Math.floor(m)+(LANG==="ka"?" წთ":"m");
  const h=m/60; if(h<24) return Math.floor(h)+(LANG==="ka"?" სთ":"h");
  const d=h/24; if(d<7) return Math.floor(d)+(LANG==="ka"?" დღე":"d");
  return new Date(ts).toLocaleDateString(LANG==="ka"?"ka-GE":undefined,{day:"numeric",month:"short",year:"numeric"});
}
async function sha(txt){
  const b=await crypto.subtle.digest("SHA-256",new TextEncoder().encode("gt2::"+txt));
  return [...new Uint8Array(b)].map(x=>x.toString(16).padStart(2,"0")).join("");
}
function toast(msg){
  const r=document.getElementById("toast-root");
  r.innerHTML=`<div class="toast">${esc(msg)}</div>`;
  clearTimeout(toast._t); toast._t=setTimeout(()=>r.innerHTML="",2600);
}

function loadSession(){
  const n = localStorage.getItem("gt_session");
  const u = n ? userByName(n) : null;
  S.user = (u && !roleFor(n).banned) ? u : null;
  if(u && roleFor(n).banned) localStorage.removeItem("gt_session");

  if(u){ localStorage.setItem("gt_session", u.username.toLowerCase()); S.user=u; }
  else { localStorage.removeItem("gt_session"); S.user=null; }
}

function matchGame(g){
  const q=S.q.trim().toLowerCase(); if(!q) return true;

/* ========================= notifications =========================
   Real, persistent, per-user records in the "notifications" collection
   (fields: userId, type, gameId/postId, actor, title snapshot, read,
   createdAt). Every write uses a deterministic id for its event type,
   so re-triggering the same event (e.g. re-liking after an unlike)
   upserts one record instead of creating duplicates. */
function myNotifications(){
  if(!S.user) return [];
  const me=S.user.username.toLowerCase();
  return [...DATA.notifications.values()].filter(n=>n.userId===me).sort(byNew);
}
function unreadNotifications(){ return myNotifications().filter(n=>!n.read); }
async function markAllNotificationsRead(){
  for(const n of myNotifications().filter(n=>!n.read)) await put("notifications",n.id,{...n,read:true}).catch(()=>{});
}
async function notifyNewGame(g){
  const recipients = usersAll().filter(u=>u.username.toLowerCase()!==String(g.author||"").toLowerCase());
  for(const u of recipients){
    const nid = "ng-"+g.id+"-"+u.username.toLowerCase();
    await put("notifications",nid,{id:nid,userId:u.username.toLowerCase(),type:"new_game",
      gameId:g.id,title:g.title,actor:g.author,read:false,createdAt:Date.now()}).catch(()=>{});
  }
}
async function notifyGameStatus(g,status,actor){
  if(!g.author) return;
  const recipientKey=g.author.toLowerCase();
  if(actor && actor.toLowerCase()===recipientKey) return;
  const nid="gs-"+g.id+"-"+status;
  await put("notifications",nid,{id:nid,userId:recipientKey,type:status==="approved"?"game_approved":"game_rejected",
    gameId:g.id,title:g.title,actor:actor||t("administrator"),read:false,createdAt:Date.now()}).catch(()=>{});
}
async function notifyComment(kind,targetId,commentId,commenter){
  const target = kind==="game" ? gameById(targetId) : DATA.posts.get(targetId);
  if(!target||!target.author) return;
  const recipientKey=target.author.toLowerCase();
  if(recipientKey===commenter.toLowerCase()) return;
  const nid="cm-"+commentId;
  await put("notifications",nid,{id:nid,userId:recipientKey,type:kind==="game"?"comment_game":"comment_post",
    gameId:kind==="game"?targetId:"",postId:kind==="post"?targetId:"",title:target.title||target.body||"",
    actor:commenter,read:false,createdAt:Date.now()}).catch(()=>{});
}
async function notifyLike(kind,targetId,liker){
  const target = kind==="games" ? gameById(targetId) : DATA.posts.get(targetId);
  if(!target||!target.author) return;
  const recipientKey=target.author.toLowerCase();
  if(recipientKey===liker.toLowerCase()) return;
  const nid="lk-"+kind+"-"+targetId+"-"+liker.toLowerCase();
  await put("notifications",nid,{id:nid,userId:recipientKey,type:"like_"+(kind==="games"?"game":"post"),
    gameId:kind==="games"?targetId:"",postId:kind==="posts"?targetId:"",title:target.title||target.body||"",
    actor:liker,read:false,createdAt:Date.now()}).catch(()=>{});
}
function notifMeta(n){
  const m={
    new_game:{ic:I.plus,cls:"new",title:t("notifNewGame"),lines:[n.title,t("notifAddedBy")+": "+n.actor]},
    game_approved:{ic:I.check,cls:"ok",title:t("notifApproved"),lines:[n.title]},
    game_rejected:{ic:I.x,cls:"bad",title:t("notifRejected"),lines:[n.title]},
    comment_game:{ic:I.chat,cls:"info",title:t("notifComment"),lines:[n.actor+" "+t("notifCommentedOn")+" "+n.title]},
    comment_post:{ic:I.chat,cls:"info",title:t("notifComment"),lines:[n.actor+" "+t("notifCommentedOn")+" "+(n.title||t("myPosts"))]},
    like_game:{ic:I.heart,cls:"like",title:t("notifLike"),lines:[n.actor+" "+t("notifLikedYourGame")+" "+n.title]},
    like_post:{ic:I.heart,cls:"like",title:t("notifLike"),lines:[n.actor+" "+t("notifLikedYourGame")+" "+(n.title||t("myPosts"))]}
  };
  return m[n.type]||{ic:I.bell,cls:"info",title:n.type,lines:[n.title||""]};
}
function notifRow(n){
  const meta=notifMeta(n);
  const go={view: n.gameId?"game":(n.type==="new_game"?"games":"community"), id:n.gameId||""};
  return `<div class="notif ${n.read?"":"unread"}">
    <span class="n-ico ${meta.cls}">${meta.ic}</span>
    <button class="notif-body" data-note='${esc(JSON.stringify(go))}'>
      <b>${esc(meta.title)}</b>

    <button class="n-del" data-delnote="${n.id}" aria-label="${esc(t("del"))}" title="${esc(t("del"))}">${I.x}</button>
  </div>`;
}

function render(){
  if(!ready) return;
  chrome();
  const map={home:vHome,games:vGames,categories:vCategories,game:vGame,add:vAdd,community:vCommunity,
             search:vSearch,profile:vProfile,admin:vAdmin};
  document.getElementById("app").innerHTML=(map[S.view]||vHome)();
  renderModal();
}
function go(view,opt){
  opt=opt||{};
  if(view==="me"&&S.user){ view="profile"; opt.profile=S.user.username; }
  if(opt.profile) S.profile=opt.profile;
  if(opt.game) S.game=opt.game;
  if(opt.cat!=null) S.cat=opt.cat;
  if(opt.tab) S.adminTab=opt.tab;
  if(view==="add" && !opt.keepEditing){ S.editing=null; S.addCover={url:"",preview:"",uploading:false,error:""}; }
  if(view!=="add") S.editing=null;
  S.view=view;
  document.getElementById("topbar").classList.remove("drawer-open");
  document.getElementById("burger").setAttribute("aria-expanded","false");
  window.scrollTo({top:0,behavior:"instant"});
  render();
}
async function openGamePage(id){
  const g=gameById(id); if(!g) return;
  const key="gt_seen_"+id;
  if(!sessionStorage.getItem(key)){
    sessionStorage.setItem(key,"1");
    put("games",id,{...g,views:(g.views||0)+1}).catch(()=>{});
  }
  go("game",{game:id});
}

/* ========================= actions ========================= */
function requireUser(){ if(!S.user){ modal="login"; renderModal(); return false; } return true; }
function askConfirm(msg){
  return new Promise(resolve=>{
    confirmMsg = msg; confirmResolve = resolve; modal = "confirm"; renderModal();
  });
}
async function toggleLike(coll,id,btn){
  if(!requireUser()) return;
  const o=DATA[coll].get(id); if(!o) return;
  const wasLiked = (o.likes||[]).includes(S.user.username);
  const s=new Set(o.likes||[]);
  wasLiked?s.delete(S.user.username):s.add(S.user.username);
  if(btn){ btn.classList.add("pop"); setTimeout(()=>btn.classList.remove("pop"),450); }
  try{
    await put(coll,id,{...o,likes:[...s]});
    if(!wasLiked) notifyLike(coll,id,S.user.username).catch(()=>{});
  }catch(err){ /* put() already rolled back and toasted */ }
}
async function delGame(id){
  const g=gameById(id); if(!g) return;
  if(!(S.user&&(isAdmin()||S.user.username===g.author))) return;
  const ok = await askConfirm(t("confirmDel"));
  if(!ok) return;
  try{
    for(const c of cFor("game",id)) await remove("comments",c.id);
    for(const n of [...DATA.notifications.values()].filter(n=>n.gameId===id)) await remove("notifications",n.id);
    await remove("games",id);
    if(S.view==="game"&&S.game===id) go("games"); else render();
    toast(t("deleted"));
  }catch(err){ /* remove() already rolled back and toasted */ }
}
async function delPost(id){
  const p=DATA.posts.get(id); if(!p) return;
  if(!(S.user&&(isAdmin()||S.user.username===p.author))) return;
  const ok = await askConfirm(t("confirmDel"));
  if(!ok) return;
  try{
    for(const c of cFor("post",id)) await remove("comments",c.id);
    await remove("posts",id);
    toast(t("deleted"));
  }catch(err){ /* remove() already rolled back and toasted */ }
}
async function delComment(id){
  const c=DATA.comments.get(id); if(!c) return;
  if(!(S.user&&(isAdmin()||S.user.username===c.author))) return;
  try{ await remove("comments",id); toast(t("deleted")); }catch(err){ /* rolled back and toasted */ }
}
async function setStatus(id,status){
  if(!isAdmin()) return;
  const g=gameById(id); if(!g) return;
  const wasApproved = g.status==="approved";
  try{
    await put("games",id,{...g,status,approvedAt:status==="approved"?Date.now():g.approvedAt});
    notifyGameStatus(g,status,S.user.username).catch(()=>{});
    if(status==="approved"&&!wasApproved) notifyNewGame(g).catch(()=>{});
    toast(status==="approved"?t("approved"):t("rejected"));
  }catch(err){ /* rolled back and toasted */ }
}
async function toggleFeature(id){
  if(!isAdmin()) return;
  const g=gameById(id); if(!g) return;
  try{ await put("games",id,{...g,featured:!g.featured,status:"approved"}); toast(t("saved")); }
  catch(err){ /* rolled back and toasted */ }
}
async function toggleAdmin(name){
  if(!isAdmin()) return;
  const u=userByName(name); if(!u) return;
  const key=u.username.toLowerCase(), cur=roleFor(u.username);
  if(S.user.username===u.username && cur.admin){ toast(t("demoteSelf")); return; }
  try{ await put("roles",key,{...cur,admin:!cur.admin}); toast(t("saved")); }
  catch(err){ toast(t("adminWriteBlocked")); }
}
async function toggleBan(name){
  if(!isAdmin()) return;
  const u=userByName(name); if(!u||u.username===S.user.username) return;
  const key=u.username.toLowerCase(), cur=roleFor(u.username);
  try{ await put("roles",key,{...cur,banned:!cur.banned}); toast(t("saved")); }
  catch(err){ toast(t("adminWriteBlocked")); }
}
async function claimFirstAdmin(){
  if(!S.user) return;
  const key=S.user.username.toLowerCase(), cur=roleFor(S.user.username);
  try{ await put("roles",key,{...cur,admin:true}); toast(t("claimedAdmin")); }
  catch(err){ toast(t("adminWriteBlocked")); }
}
async function delUser(name){
  if(!isAdmin()) return;
  const u=userByName(name); if(!u||u.username===S.user.username) return;
  const ok = await askConfirm(t("confirmDel"));
  if(!ok) return;
  try{
    for(const g of allGames().filter(g=>g.author===u.username)){
      for(const c of cFor("game",g.id)) await remove("comments",c.id);
      await remove("games",g.id);
    }
    for(const p of posts().filter(p=>p.author===u.username)){
      for(const c of cFor("post",p.id)) await remove("comments",c.id);
      await remove("posts",p.id);
    }
    for(const c of comments().filter(c=>c.author===u.username)) await remove("comments",c.id);
    for(const n of [...DATA.notifications.values()].filter(n=>n.userId===u.username.toLowerCase())) await remove("notifications",n.id);
    await remove("users",u.username.toLowerCase());
    toast(t("deleted"));
  }catch(err){ /* remove() already rolled back and toasted */ }
}

/* ========================= events ========================= */
document.addEventListener("click", async e=>{
  const sel="[data-go],[data-auth],[data-close],[data-overlay],[data-modal],[data-logout],[data-lang],[data-game],[data-profile],[data-cat],[data-cat-page],[data-filter],[data-feed],[data-atab],[data-like],[data-plike],[data-clike],[data-delgame],[data-delpost],[data-delcomment],[data-approve],[data-reject],[data-feature],[data-editgame],[data-togadmin],[data-ban],[data-deluser],[data-pcomments],[data-share],[data-note],[data-confirmyes],[data-confirmno],[data-delnote],[data-clearnotes],[data-removecover]";
  const el=e.target.closest(sel);
  if(!el) return;
  const d=el.dataset;
  if(d.confirmyes!==undefined){ const r=confirmResolve; confirmResolve=null; modal=null; renderModal(); if(r) r(true); return; }
  if(d.confirmno!==undefined){ const r=confirmResolve; confirmResolve=null; modal=null; renderModal(); if(r) r(false); return; }
  if(d.overlay!==undefined && el===e.target){
    if(modal==="confirm"){ const r=confirmResolve; confirmResolve=null; modal=null; renderModal(); if(r) r(false); return; }
    modal=null; renderModal(); return;
  }
  if(d.overlay!==undefined) return;
  if(d.close!==undefined){
    if(modal==="confirm"){ const r=confirmResolve; confirmResolve=null; modal=null; renderModal(); if(r) r(false); return; }
    modal=null; renderModal(); return;
  }
  if(d.lang){ LANG=d.lang; localStorage.setItem("gt_lang",LANG); render(); return; }
  if(d.go!==undefined){ modal=null; go(d.go); return; }
  if(d.auth){ modal=d.auth; renderModal(); return; }
  if(d.modal){
    modal=d.modal;
    if(d.modal==="notes"){ renderModal(); markAllNotificationsRead(); return; }
    renderModal(); return;
  }
  if(d.logout!==undefined){ setSession(null); modal=null; if(S.view==="admin"||S.view==="add") S.view="home"; toast(t("loggedOut")); render(); return; }
  if(d.game){ modal=null; openGamePage(d.game); return; }
  if(d.profile){ modal=null; go("profile",{profile:d.profile}); return; }
  if(d.catPage){ go("games",{cat:d.catPage}); return; }
  if(d.cat){ S.cat=d.cat; render(); return; }
  if(d.filter){ S.filter=d.filter; render(); return; }
  if(d.feed){ S.feedTab=d.feed; render(); return; }
  if(d.atab){ S.adminTab=d.atab; render(); return; }
  if(d.like){ await toggleLike("games",d.like,el); return; }
  if(d.plike){ await toggleLike("posts",d.plike,el); return; }
  if(d.clike){ await toggleLike("comments",d.clike,el); return; }
  if(d.pcomments){ S.openPost = S.openPost===d.pcomments?null:d.pcomments; render(); return; }
  if(d.share){ const p=DATA.posts.get(d.share); const url=location.href.split("#")[0]+"#post-"+d.share;
    try{ await navigator.clipboard.writeText(url); toast(t("share")+" ✓"); }catch(err){ toast(url); } return; }
  if(d.delgame){ await delGame(d.delgame); return; }
  if(d.delpost){ await delPost(d.delpost); return; }
  if(d.delcomment){ await delComment(d.delcomment); return; }
  if(d.approve){ await setStatus(d.approve,"approved"); return; }
  if(d.reject){ await setStatus(d.reject,"rejected"); return; }
  if(d.feature){ await toggleFeature(d.feature); return; }
  if(d.editgame){ S.editing=d.editgame; const g=gameById(d.editgame);
    S.addCover={url:g&&g.cover||"",preview:g&&g.cover||"",uploading:false,error:""};
    modal=null; go("add",{keepEditing:true}); return; }
  if(d.togadmin){ await toggleAdmin(d.togadmin); return; }
  if(d.ban){ await toggleBan(d.ban); return; }
  if(d.deluser){ await delUser(d.deluser); return; }
  if(d.note){ try{ const g=JSON.parse(d.note); modal=null; if(g.view==="game"&&g.id) openGamePage(g.id); else go(g.view||"home",{tab:g.tab}); }catch(err){} return; }
  if(d.delnote){ try{ await remove("notifications",d.delnote); }catch(err){} return; }
  if(d.clearnotes!==undefined){
    for(const n of myNotifications()){ try{ await remove("notifications",n.id); }catch(err){} }
    return;
  }
  if(d.removecover!==undefined){ S.addCover={url:"",preview:"",uploading:false,error:""}; render(); return; }
});

document.addEventListener("submit", async e=>{
  const form=e.target;

  if(form.id==="auth-form"){
    e.preventDefault();
    const name=document.getElementById("a-user").value.trim();
    const pass=document.getElementById("a-pass").value;
    const err=document.getElementById("a-err");
    if(!/^[a-zA-Z0-9_.-]{3,20}$/.test(name)){ err.textContent=t("badName"); return; }
    const key=name.toLowerCase(), ex=userByName(key), hash=await sha(pass);
    if(modal==="register"){
      if(ex){ err.textContent=t("taken"); return; }
      const u={username:name,pass:hash,createdAt:Date.now()};
      await put("users",key,u); setSession(u);
      toast(t("welcome"));
    }else{
      if(!ex||ex.pass!==hash){ err.textContent=t("badLogin"); return; }
      if(roleFor(key).banned){ err.textContent=t("banned"); return; }
      setSession(ex); toast(t("welcome"));
    }
    modal=null; render(); return;
  }

  if(form.id==="game-form"){
    e.preventDefault();
    if(!S.user) return;
    const err=document.getElementById("gf-err");
    const val=n=>{ const el=form.querySelector(`[name="${n}"]`); return el?el.value.trim():""; };
    const title=val("title"), link=safeUrl(val("link"));
    if(!title){ err.textContent=t("needName"); return; }
    if(!link){ err.textContent=t("needLink"); return; }
    if(S.addCover.uploading){ err.textContent=t("waitForUpload"); return; }
    err.textContent="";
    const shots=val("screenshots").split(",").map(s=>safeUrl(s)).filter(Boolean);
    const prev=S.editing?gameById(S.editing):null;
    const id=prev?prev.id:uid();
    const admin=isAdmin();
    const wasApproved = prev && prev.status==="approved";
    const rec={
      id, title, link,
      official:safeUrl(val("official"))||"", source:safeUrl(val("source"))||"", trailer:safeUrl(val("trailer"))||"",
      cover:S.addCover.url||"",
      screenshots:shots, description:val("description"), category:val("category"),
      platform:val("platform"), year:val("year"),
      author:prev?prev.author:S.user.username,
      createdAt:prev?prev.createdAt:Date.now(), updatedAt:Date.now(),
      likes:prev?prev.likes||[]:[], views:prev?prev.views||0:0,
      featured:prev?!!prev.featured:false,
      status: prev ? (admin?"approved":prev.status) : (admin?"approved":"pending"),
      approvedAt: prev?prev.approvedAt:(admin?Date.now():null)
    };
    try{
      await put("games",id,rec);
      S.editing=null; S.addCover={url:"",preview:"",uploading:false,error:""};
      if(rec.status==="approved"){
        toast(prev?t("saved"):t("published"));
        if(!wasApproved) notifyNewGame(rec).catch(()=>{});
        openGamePage(id);
      }else{ toast(t("submitted")); go("add"); }
    }catch(err2){ err.textContent=t("actionFailed"); }
    return;
  }

  if(form.id==="post-form"){
    e.preventDefault();
    if(!S.user) return;
    const errEl=document.getElementById("p-err");
    const body=document.getElementById("p-body").value.trim();
    if(!body){ errEl.textContent=t("needBody"); return; }
    const id=uid();
    try{
      await put("posts",id,{id,type:document.getElementById("p-type").value,
        title:document.getElementById("p-title").value.trim(),
        body, image:safeUrl(document.getElementById("p-img").value)||"",
        gameId:document.getElementById("p-game").value||"",
        author:S.user.username,createdAt:Date.now(),likes:[]});
      modal=null; toast(t("published")); go("community");
    }catch(err2){ errEl.textContent=t("actionFailed"); }
    return;
  }

  if(form.dataset.cform){
    e.preventDefault();
    if(!S.user) return;
    const [kind,tid]=form.dataset.cform.split(":");
    const input=form.querySelector('[name="text"]');
    const text=input.value.trim(); if(!text) return;
    input.value="";
    const id=uid();
    try{
      await put("comments",id,{id,target:kind,targetId:tid,author:S.user.username,text,createdAt:Date.now(),likes:[]});
      notifyComment(kind,tid,id,S.user.username).catch(()=>{});
    }catch(err2){ input.value=text; toast(t("actionFailed")); }
    return;
  }
});

/* cover upload */
document.addEventListener("click",e=>{ if(e.target.id==="gf-upload"){ const f=document.getElementById("gf-file"); if(f) f.click(); } });
const ACCEPTED_IMAGE_TYPES = ["image/jpeg","image/png","image/webp"];
const MAX_COVER_BYTES = 12*1024*1024; /* 12MB, comfortably under the 20MiB asset cap */
document.addEventListener("change", async e=>{
  if(e.target.id!=="gf-file") return;
  const file=e.target.files&&e.target.files[0];
  e.target.value="";
  if(!file) return;

  if(!ACCEPTED_IMAGE_TYPES.includes(file.type)){
    S.addCover={...S.addCover,error:t("invalidImageType")}; render(); return;
  }
  if(file.size>MAX_COVER_BYTES){
    S.addCover={...S.addCover,error:t("imageTooLarge")}; render(); return;
  }

  /* instant local preview while the real upload runs in the background */
  const reader=new FileReader();
  reader.onload=()=>{
    S.addCover={url:"",preview:String(reader.result),uploading:true,error:""};
    render();
    doUpload(file);
  };
  reader.onerror=()=>{ S.addCover={...S.addCover,error:t("uploadFail"),uploading:false}; render(); };
  reader.readAsDataURL(file);
});
async function doUpload(file){
  if(!assets){
    S.addCover={...S.addCover,uploading:false,error:t("uploadNA")}; render(); return;
  }
  try{
    const r=await assets.upload(file);
    /* the preview snapshot may have been cleared/replaced while this ran; only
       apply the result if the form is still waiting on this same upload */
    if(S.addCover.uploading) S.addCover={url:r.url,preview:r.url,uploading:false,error:""};
    render();
  }catch(err){
    S.addCover={...S.addCover,uploading:false,error:t("uploadFail")}; render();
  }
}

/* ========================= boot ========================= */
function waitForClaude(){
  return new Promise(res=>{
    if(window.claude&&window.claude.use) return res(window.claude);
    let n=0; const iv=setInterval(()=>{
      if(window.claude&&window.claude.use){ clearInterval(iv); res(window.claude); }
      else if(++n>60){ clearInterval(iv); res(null); }
    },100);
  });
}
async function cleanupLegacy(){
  /* removes only the old auto-imported v1 entries, never library records */
  for(const g of allGames()) if(/^seed-\d+$/.test(String(g.id||""))) await remove("games",g.id);
  const legacy=DATA.users.get("gametime");
  if(legacy&&legacy.seeded) await remove("users","gametime");
  for(const [id,g] of DATA.games){
    if(g&&g.name&&!g.title) await put("games",id,{...g,title:g.name,status:g.status||"approved"});
  }
}
/* Removes the previously auto-created library entries (by stable id)
   and their comments, once. Never recreates or imports anything. Safe
   to run on every load: once removed, these ids simply stay absent. */
async function seedLibrary(){
  for(const id of REMOVED_SEED_IDS){
    if(DATA.games.has(id)){
      for(const c of cFor("game",id)) await remove("comments",c.id);
      await remove("games",id);
    }
  }
  const legacyAuthor = DATA.users.get("gametime");
  if(legacyAuthor && legacyAuthor.official && !allGames().some(g=>g.author===SEED_AUTHOR)){
    await remove("users","gametime");
  }
}
const SEED_AUTHOR = "GameTime";
function syncUser(){
  if(!S.user) return;
  const f=userByName(S.user.username);
  if(!f||roleFor(S.user.username).banned){ setSession(null); } else S.user=f;
}
async function boot(){
  const c=await waitForClaude();
  if(c){ try{ db=await c.use("db"); }catch(err){ db=null; }
         try{ assets=await c.use("assets"); }catch(err){ assets=null; } }
  if(db){
    let seen=0; const colls=["games","posts","comments","users","notifications"];
    colls.forEach(coll=>{
      db.collection(coll).onSnapshot(snap=>{
        DATA[coll].clear();
        snap.docs.forEach(doc=>{ const v=doc.data(); if(v) DATA[coll].set(doc.id,v); });
        seen++;
        if(!ready&&seen>=colls.length){ ready=true; loadSession();
          cleanupLegacy().then(seedLibrary).catch(()=>{}); }
        else syncUser();
        if(ready) render();
      },()=>{ if(!ready){ ready=true; lsLoad(); loadSession(); render(); } });
    });
    setTimeout(()=>{ if(!ready){ ready=true; loadSession(); render(); } },5000);
  }else{
    lsLoad(); ready=true; loadSession(); await cleanupLegacy(); await seedLibrary(); render();
  }
}
chrome(); boot();
})();
